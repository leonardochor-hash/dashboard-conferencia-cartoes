<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conferência de Cartões · LivePDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f10;
  --surface: #1a1a1c;
  --surface-2: #232326;
  --border: #2a2a2e;
  --border-hover: #3a3a3f;
  --text: #ededee;
  --text-muted: #8a8a90;
  --text-dim: #5a5a5f;
  --accent: #d4a574;
  --success: #4ade80;
  --warning: #facc15;
  --danger: #f87171;
  --info: #60a5fa;
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ===== LOGIN ===== */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px;
  width: 100%;
  max-width: 380px;
}
.login-box h1 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 28px;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.login-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
.login-box label {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.login-box input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  margin-bottom: 16px;
  transition: border-color 0.15s;
}
.login-box input:focus { outline: none; border-color: var(--accent); }
.login-box button {
  width: 100%;
  padding: 11px;
  background: var(--accent);
  color: #1a1a1c;
  border: none;
  border-radius: 6px;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.login-box button:hover { opacity: 0.9; }
.login-error {
  color: var(--danger);
  font-size: 13px;
  margin-top: 10px;
  display: none;
}

/* ===== DASHBOARD ===== */
.app { display: none; }
.app.active { display: block; }

header {
  border-bottom: 1px solid var(--border);
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
header h1 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.3px;
}
header .subtitle {
  color: var(--text-muted);
  font-size: 12px;
  margin-top: 2px;
}
header .actions { display: flex; gap: 10px; align-items: center; }

select, .btn {
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
select:hover, .btn:hover { border-color: var(--border-hover); background: var(--surface-2); }
.btn-primary {
  background: var(--accent);
  color: #1a1a1c;
  border-color: var(--accent);
  font-weight: 600;
}
.btn-primary:hover { opacity: 0.9; background: var(--accent); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-success {
  background: rgba(74, 222, 128, 0.1);
  color: var(--success);
  border-color: rgba(74, 222, 128, 0.3);
}
.btn-success:hover { background: rgba(74, 222, 128, 0.15); }
.btn-icon-only { padding: 8px 10px; }

main { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }

/* ===== CARDS ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
}
.stat-card .label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
}
.stat-card .value {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 500;
}
.stat-card.success .value { color: var(--success); }
.stat-card.warning .value { color: var(--warning); }
.stat-card.danger .value { color: var(--danger); }

/* ===== TABS ===== */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.tab {
  padding: 10px 16px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
  font-weight: 500;
}

/* ===== ITEMS ===== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state .big-check {
  font-family: var(--font-serif);
  font-size: 48px;
  color: var(--success);
  margin-bottom: 12px;
}

.item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 10px;
  transition: border-color 0.15s;
}
.item:hover { border-color: var(--border-hover); }
.item.match { border-left-color: var(--warning); }
.item.cod_errado { border-left-color: var(--accent); }
.item.codigo_duplicado { border-left-color: #fb923c; }
.item.duplicado { border-left-color: #c084fc; }
.item.divergencia { border-left-color: var(--danger); }
.item.orfao { border-left-color: var(--danger); }
.item.fantasma { border-left-color: var(--info); }

.item-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
}
.item-header-left { display: flex; flex-direction: column; gap: 4px; }
.item-meta {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.item-meta strong { color: var(--text); font-family: var(--font-mono); }

.badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  width: fit-content;
}
.badge.match { background: rgba(250, 204, 21, 0.15); color: var(--warning); }
.badge.cod_errado { background: rgba(212, 165, 116, 0.18); color: var(--accent); }
.badge.codigo_duplicado { background: rgba(251, 146, 60, 0.15); color: #fb923c; }
.cand-sel { margin-top: 10px; padding: 10px 12px; border: 1px dashed #fb923c; border-radius: 8px; background: rgba(251,146,60,0.06); }
.cand-sel .stitle { margin-bottom: 6px; }
.cand-opt { display: block; padding: 5px 4px; cursor: pointer; border-radius: 6px; }
.cand-opt:hover { background: rgba(255,255,255,0.04); }
.cand-opt input { margin-right: 8px; }
.badge.duplicado { background: rgba(192, 132, 252, 0.15); color: #c084fc; }
.badge.divergencia, .badge.orfao { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
.badge.fantasma { background: rgba(96, 165, 250, 0.15); color: var(--info); }

.badge-conf {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
  margin-left: 6px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.badge-conf.alta { background: rgba(74, 222, 128, 0.15); color: var(--success); }
.badge-conf.media { background: rgba(250, 204, 21, 0.15); color: var(--warning); }

.suggestion {
  background: var(--surface-2);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 12px;
  font-size: 12.5px;
  line-height: 1.55;
  border-left: 2px solid var(--accent);
}
.suggestion .stitle {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.suggestion code {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  word-break: break-all;
}

.item-value {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
}
.item-value.danger { color: var(--danger); }

.compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.compare > div {
  background: var(--surface-2);
  border-radius: 6px;
  padding: 8px 12px;
}
.compare .label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.compare .data {
  font-family: var(--font-mono);
  font-size: 12px;
  word-break: break-all;
}
.compare .data strong { color: var(--accent); }

.item-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.item-actions .btn { font-size: 12px; padding: 6px 12px; }

.loading {
  display: none;
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}
.loading.active { display: block; }
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  header, main { padding: 16px 18px; }
  .compare { grid-template-columns: 1fr; }
  .item-actions { flex-wrap: wrap; }
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>Conferência de cartões</h1>
    <p>LivePDV ↔ Zoop</p>
    <label>Senha de acesso</label>
    <input type="password" id="login-password" autofocus onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error">Senha incorreta.</div>
  </div>
</div>

<!-- ===== APP ===== -->
<div class="app" id="app">
  <header>
    <div>
      <h1>Conferência de cartões</h1>
      <div class="subtitle" id="header-subtitle">Hoje · LivePDV ↔ Zoop</div>
    </div>
    <div class="actions">
      <select id="loja-filter" onchange="renderList()">
        <option value="all">Todas as lojas</option>
        <option value="1">RSul (RS)</option>
        <option value="3">Barrabox (BS)</option>
        <option value="4">NovaPS (NS)</option>
      </select>
      <select id="data-filter" onchange="conferir()"></select>
      <button class="btn btn-primary" id="btn-conferir" onclick="conferir()">
        ↻ Conferir agora
      </button>
      <button class="btn" id="btn-simular" onclick="autocorrigir(true)" title="Mostra o que seria corrigido sem alterar nada">⚙ Simular auto</button>
      <button class="btn btn-success" id="btn-auto" onclick="autocorrigir(false)" title="Aplica só correções de confiança alta">⚡ Auto-corrigir</button>
      <button class="btn btn-icon-only" onclick="logout()" title="Sair">⎋</button>
    </div>
  </header>

  <main>
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card success">
        <div class="label">Conciliado</div>
        <div class="value" id="stat-ok">—</div>
      </div>
      <div class="stat-card warning">
        <div class="label">Sugestões (aceitar)</div>
        <div class="value" id="stat-match">—</div>
      </div>
      <div class="stat-card danger">
        <div class="label">Diverg. / Duplicados</div>
        <div class="value" id="stat-diverg">—</div>
      </div>
      <div class="stat-card danger">
        <div class="label">Órfãos / Fantasmas</div>
        <div class="value" id="stat-orfao">—</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="pendentes" onclick="switchTab('pendentes')">
        Pendentes <span id="count-pendentes">(0)</span>
      </div>
      <div class="tab" data-tab="resolvidos" onclick="switchTab('resolvidos')">
        Resolvidos <span id="count-resolvidos">(0)</span>
      </div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <span class="spinner"></span> Buscando dados do Moombox...
    </div>

    <div id="auto-result"></div>
    <!-- Lista -->
    <div id="lista"></div>
  </main>
</div>

<script>
// ============= CONFIG =============
const DASHBOARD_PASSWORD = 'cartoes2026'; // mude isso depois
const STORAGE_KEY = 'conf_cartoes_auth';
const RESOLVED_KEY = 'conf_cartoes_resolved';
const API_ENDPOINT = '/api/conferir';

const LOJA_NOMES = { 1: 'RSul', 3: 'Barrabox', 4: 'NovaPS' };

// ============= STATE =============
let dados = { problemas: [], stats: {} };
let resolvidos = loadResolved();
let currentTab = 'pendentes';

// ============= LOGIN =============
function checkAuth() {
  if (sessionStorage.getItem(STORAGE_KEY) === 'ok') {
    showApp();
  }
}
function doLogin() {
  const pwd = document.getElementById('login-password').value;
  if (pwd === DASHBOARD_PASSWORD) {
    sessionStorage.setItem(STORAGE_KEY, 'ok');
    showApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
function logout() {
  sessionStorage.removeItem(STORAGE_KEY);
  location.reload();
}
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  popularDatas();
  conferir();
}

function popularDatas() {
  const select = document.getElementById('data-filter');
  if (!select) return;
  const hoje = new Date();
  hoje.setHours(12, 0, 0, 0);
  const opts = [];
  for (let i = 0; i <= 30; i++) {
    const d = new Date(hoje);
    d.setDate(hoje.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    const dia = String(d.getDate()).padStart(2, '0');
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const ano = d.getFullYear();
    let label = `${dia}/${mes}/${ano}`;
    if (i === 0) label = `Hoje · ${label}`;
    else if (i === 1) label = `Ontem · ${label}`;
    opts.push(`<option value="${iso}"${i === 0 ? ' selected' : ''}>${label}</option>`);
  }
  select.innerHTML = opts.join('');
}

// ============= STORAGE (resolvidos) =============
function loadResolved() {
  try {
    const today = new Date().toISOString().slice(0, 10);
    const stored = JSON.parse(localStorage.getItem(RESOLVED_KEY) || '{}');
    if (stored.date !== today) return { date: today, ids: {} };
    return stored;
  } catch { return { date: new Date().toISOString().slice(0, 10), ids: {} }; }
}
function saveResolved() {
  localStorage.setItem(RESOLVED_KEY, JSON.stringify(resolvidos));
}
function marcarResolvido(id, action) {
  resolvidos.ids[id] = { action, at: new Date().toISOString() };
  saveResolved();
  renderList();
  updateStats();
}

// Aceitar uma correção sugerida (semi-automático: o sistema sugere, você aceita).
//   modo "preencher"  -> grava o cód num pagamento que está sem código (caso "match")
//   modo "substituir" -> troca o cód errado pelo correto (caso "cod_errado")
async function aceitarCorrecao(id, cupomId, codCorreto, valorEsperado, modo, codErrado) {
  modo = modo || 'preencher';
  const labelBtn = '✓ Aceitar correção';
  const resumo = modo === 'substituir'
    ? `Trocar o código do cupom ${cupomId}:\nde  ${(codErrado||'').slice(0,16)}...\npara ${codCorreto.slice(0,16)}...`
    : `Preencher o código do cupom ${cupomId} com ${codCorreto.slice(0,16)}...`;
  if (!confirm(`${resumo}\n\nIsso vai SALVAR a alteração no LivePDV.`)) return;

  const btn = event && event.target ? event.target : null;
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }

  try {
    const res = await fetch('/api/aprovar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cupom_id: String(cupomId).replace(/^0+/, ''),
        cod_autoriza: codCorreto,
        valor_esperado: valorEsperado,
        modo: modo,
        cod_atual: codErrado || undefined,
      }),
    });
    const data = await res.json().catch(() => null);

    if (!res.ok) {
      const erro = data?.error || `HTTP ${res.status}`;
      alert(`❌ Falhou: ${erro}\n\n${data?.traceback ? data.traceback.slice(0, 400) : ''}`);
      if (btn) { btn.disabled = false; btn.textContent = labelBtn; }
      return;
    }

    marcarResolvido(id, modo === 'substituir' ? 'cod_corrigido' : 'cod_preenchido');
    alert(`✅ Correção aplicada no LivePDV.\nCupom: ${cupomId}`);
  } catch (e) {
    alert(`❌ Erro de rede: ${e.message}`);
    if (btn) { btn.disabled = false; btn.textContent = labelBtn; }
  }
}
// Aceitar correção de duplicado: APAGA o pagamento de cartão do cupom.
async function apagarPagamento(id, cupomId, valorEsperado) {
  if (!confirm(`APAGAR o pagamento de cartão de ${fmtMoney(valorEsperado)} do cupom ${cupomId}?\n\nIsso remove a linha de cartão do cupom no LivePDV.`)) return;
  const btn = event && event.target ? event.target : null;
  if (btn) { btn.disabled = true; btn.textContent = 'Apagando...'; }
  try {
    const res = await fetch('/api/aprovar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cupom_id: String(cupomId).replace(/^0+/, ''),
        modo: 'apagar',
        valor_esperado: valorEsperado,
      }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      alert(`❌ Falhou: ${data?.error || 'HTTP ' + res.status}`);
      if (btn) { btn.disabled = false; btn.textContent = '✓ Aceitar (apagar cartão)'; }
      return;
    }
    marcarResolvido(id, 'cartao_apagado');
    alert(`✅ Pagamento de cartão apagado do cupom ${cupomId}.`);
  } catch (e) {
    alert(`❌ Erro de rede: ${e.message}`);
    if (btn) { btn.disabled = false; btn.textContent = '✓ Aceitar (apagar cartão)'; }
  }
}
function reabrir(id) {
  delete resolvidos.ids[id];
  saveResolved();
  renderList();
  updateStats();
}

// ============= API =============
async function conferir() {
  const btn = document.getElementById('btn-conferir');
  const loading = document.getElementById('loading');
  btn.disabled = true;
  loading.classList.add('active');
  document.getElementById('lista').innerHTML = '';

  const dataInput = document.getElementById('data-filter');
  const dataParam = dataInput && dataInput.value ? `?data=${dataInput.value}` : '';
  const url = API_ENDPOINT + dataParam;

  try {
    const res = await fetch(url, { method: 'POST' });
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const detalhe = data ? `
        <div style="text-align:left; max-width:700px; margin: 16px auto; padding: 12px; background: var(--surface-2); border-radius: 6px; font-family: var(--font-mono); font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow:auto;">
          <strong>Tipo:</strong> ${data.type || '?'}
          <strong>Erro:</strong> ${data.error || '?'}
          ${data.detail ? `\n<strong>Detalhe:</strong> ${data.detail}` : ''}
          ${data.traceback ? `\n\n<strong>Traceback:</strong>\n${data.traceback}` : ''}
        </div>` : '';
      document.getElementById('lista').innerHTML = `
        <div class="empty-state">
          <div style="color: var(--danger); font-size: 16px; margin-bottom: 8px;">Erro HTTP ${res.status}</div>
          ${detalhe}
        </div>`;
      return;
    }
    dados = data;
    updateStats();
    renderList();
    const ts = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const dataRef = data.data_referencia ? new Date(data.data_referencia + 'T12:00:00').toLocaleDateString('pt-BR') : 'hoje';
    const totais = data.totais || {};
    document.getElementById('header-subtitle').textContent =
      `${dataRef} · ${totais.vendas_livepdv || 0} vendas PDV · ${totais.transacoes_zoop || 0} Zoop · conferido ${ts}`;
  } catch (e) {
    document.getElementById('lista').innerHTML = `
      <div class="empty-state">
        <div style="color: var(--danger); font-size: 16px; margin-bottom: 8px;">Erro ao buscar dados</div>
        <div style="font-size: 13px;">${e.message}</div>
      </div>`;
  } finally {
    btn.disabled = false;
    loading.classList.remove('active');
  }
}

// ============= AUTOCORREÇÃO =============
const AUTO_TOKEN_KEY = 'conf_cartoes_auto_token';
async function autocorrigir(dryRun) {
  const dataInput = document.getElementById('data-filter');
  const dataRef = dataInput && dataInput.value ? dataInput.value : '';
  if (!dryRun && !confirm(`Aplicar automaticamente TODAS as correções de confiança alta${dataRef ? ' de ' + dataRef : ''}?\n\nSó match / código errado / código duplicado. Nunca apaga pagamento.\nIsso SALVA no LivePDV.`)) return;

  let token = localStorage.getItem(AUTO_TOKEN_KEY) || '';
  const out = document.getElementById('auto-result');
  const btns = ['btn-simular','btn-auto'].map(i=>document.getElementById(i));
  btns.forEach(b=>b.disabled=true);
  out.innerHTML = `<div class="loading active"><span class="spinner"></span> ${dryRun ? 'Simulando' : 'Aplicando'} correções...</div>`;

  try {
    const params = new URLSearchParams();
    if (dataRef) params.set('data', dataRef);
    if (dryRun) params.set('dry_run', '1');
    if (token) params.set('token', token);
    let res = await fetch('/api/autocorrigir?' + params, { method: 'POST' });
    if (res.status === 401) {
      token = prompt('Token de autocorreção (AUTOCORRIGIR_TOKEN):') || '';
      if (!token) { out.innerHTML=''; return; }
      localStorage.setItem(AUTO_TOKEN_KEY, token);
      params.set('token', token);
      res = await fetch('/api/autocorrigir?' + params, { method: 'POST' });
    }
    const d = await res.json().catch(()=>null);
    if (!res.ok || !d) { out.innerHTML = `<div class="empty-state" style="color:var(--danger)">Erro ${res.status}: ${d && d.error || '?'}</div>`; return; }
    if (d.abortado) { out.innerHTML = `<div class="empty-state" style="color:var(--warning)">Abortado: ${d.abortado}</div>`; return; }

    const r = d.resumo || {};
    const li = (arr, cls) => arr.map(a => `<li>${cls==='ok'?'✓':cls==='err'?'✗':'•'} <strong>${a.tipo}</strong> loja ${a.loja_id} cupom #${a.cupom} ${fmtMoney(a.valor)}${a.payload ? ' → <code>'+String(a.payload.cod_autoriza).slice(0,14)+'…</code>' : ''}${a.motivo ? ' <span style="color:var(--text-muted)">('+a.motivo+')</span>' : ''}${a.resposta && a.resposta.error ? ' <span style="color:var(--danger)">'+a.resposta.error+'</span>' : ''}</li>`).join('');
    out.innerHTML = `
      <div class="suggestion" style="margin-bottom:16px">
        <div class="stitle">${dryRun ? 'SIMULAÇÃO' : 'AUTOCORREÇÃO'} · ${d.data_referencia} · ${r.segundos}s</div>
        Elegíveis: <strong>${r.elegiveis}</strong> · ${dryRun ? 'Seriam aplicadas' : 'Aplicadas'}: <strong>${r.aplicadas}</strong> · Falhas: <strong>${r.falhas}</strong> · Ficam manuais: <strong>${r.manuais}</strong>
        ${d.aplicadas.length ? '<ul>'+li(d.aplicadas,'ok')+'</ul>' : ''}
        ${d.falhas.length ? '<div class="stitle" style="color:var(--danger)">Falhas</div><ul>'+li(d.falhas,'err')+'</ul>' : ''}
        ${d.manuais.length ? '<details><summary>Fila manual (${d.manuais.length})</summary><ul>'+li(d.manuais,'m')+'</ul></details>' : ''}
      </div>`;
    if (!dryRun) { (d.aplicadas||[]).forEach(a => marcarResolvido(a.id, 'auto')); conferir(); }
  } catch (e) {
    out.innerHTML = `<div class="empty-state" style="color:var(--danger)">${e.message}</div>`;
  } finally { btns.forEach(b=>b.disabled=false); }
}

// ============= RENDER =============
function updateStats() {
  const s = dados.stats || {};
  document.getElementById('stat-ok').textContent = s.conciliado || 0;
  // Sugestões com botão "Aceitar": preencher cód (match) + trocar cód (cod_errado)
  document.getElementById('stat-match').textContent = countByType('match') + countByType('cod_errado') + countByType('codigo_duplicado');
  document.getElementById('stat-diverg').textContent = countByType('divergencia') + countByType('duplicado');
  document.getElementById('stat-orfao').textContent = countByType('orfao') + countByType('fantasma');

  const filtered = filterByLoja(dados.problemas || []);
  const pendentes = filtered.filter(p => !resolvidos.ids[p.id]).length;
  const resolvedos = filtered.filter(p => resolvidos.ids[p.id]).length;
  document.getElementById('count-pendentes').textContent = `(${pendentes})`;
  document.getElementById('count-resolvidos').textContent = `(${resolvedos})`;
}

function countByType(type) {
  const filtered = filterByLoja(dados.problemas || []);
  return filtered.filter(p => p.tipo === type && !resolvidos.ids[p.id]).length;
}

function filterByLoja(items) {
  const loja = document.getElementById('loja-filter').value;
  if (loja === 'all') return items;
  return items.filter(p => String(p.loja_id) === loja);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderList();
}

function fmtMoney(v) {
  return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function renderList() {
  updateStats();
  const lista = document.getElementById('lista');
  const filtered = filterByLoja(dados.problemas || []);
  const items = currentTab === 'pendentes'
    ? filtered.filter(p => !resolvidos.ids[p.id])
    : filtered.filter(p => resolvidos.ids[p.id]);

  if (items.length === 0) {
    if (currentTab === 'pendentes' && (dados.problemas || []).length > 0) {
      lista.innerHTML = `
        <div class="empty-state">
          <div class="big-check">✓</div>
          <div>Nenhum problema pendente nesta loja.</div>
        </div>`;
    } else if (currentTab === 'pendentes') {
      lista.innerHTML = `
        <div class="empty-state">
          <div>Clique em "Conferir agora" para buscar os dados do dia.</div>
        </div>`;
    } else {
      lista.innerHTML = `
        <div class="empty-state"><div>Nenhum item resolvido ainda.</div></div>`;
    }
    return;
  }

  lista.innerHTML = items.map(renderItem).join('');
}

function codEscolhido(pid, fallback) {
  const sel = document.querySelector(`input[name="cand_${pid}"]:checked`);
  return sel ? sel.value : fallback;
}
function renderCandidatos(p) {
  const def = p.cod_certo || p.zoop_id || '';
  const opts = p.candidatos.map(c =>
    `<label class="cand-opt"><input type="radio" name="cand_${p.id}" value="${c.zoop_id}" ${c.zoop_id === def ? 'checked' : ''}> `
    + `${fmtMoney(c.valor)} · <code>${c.zoop_id}</code>${c.cod_autorizacao ? ` · aut ${c.cod_autorizacao}` : ''}</label>`
  ).join('');
  return `<div class="cand-sel"><div class="stitle">Escolha o cartão Zoop correto (${p.candidatos.length} no mesmo valor):</div>${opts}</div>`;
}

function renderItem(p) {

  const cupomText = p.cupom ? `Cupom <strong>#${p.cupom}</strong>` : '<em style="color: var(--text-dim)">sem cupom no LivePDV</em>';

        </div>
      </div>`;
    actions = isResolved
      ? `<button class="btn" onclick="reabrir('${p.id}')">Reabrir</button>`
      : `<button class="btn" onclick="marcarResolvido('${p.id}','ignorado')">Ignorar</button>

      <div class="suggestion">
        <div class="stitle">Correção sugerida</div>
        ${p.subtipo === 'mesmo_cod_no_cupom' ? `O cupom <strong>#${p.cupom}</strong> (${fmtMoney(p.valor_cupom)}) tem 2+ pagamentos de cartão com o mesmo código. O pagamento de <strong>${fmtMoney(p.valor)}</strong> recebe o cód. correto; o outro mantém o atual.<br>` : `Trocar o cód. de autorização do cupom <strong>#${p.cupom}</strong>:<br>`}
        de <code>${p.cod_errado}</code><br>
        para <code>${p.cod_certo}</code> (transação Zoop de ${fmtMoney(p.valor_zoop || p.valor)})${p.outros_candidatos ? ` <span style="color:var(--warning)">(há ${p.outros_candidatos} outra(s) no mesmo valor — confira antes)</span>` : ''}
      </div>
      <div class="compare">
        <div>
          <div class="label">LivePDV · cupom ${p.cupom} (cód atual, errado)</div>
          <div class="data">${fmtMoney(p.valor)} · <strong>${p.cod_errado}</strong></div>
        </div>
        <div>
          <div class="label">Zoop (succeeded) correto</div>
          <div class="data">${fmtMoney(p.valor_zoop || p.valor)} · <strong>${p.cod_certo}</strong></div>
        </div>
      </div>`;
    actions = isResolved
      ? `<button class="btn" onclick="reabrir('${p.id}')">Reabrir</button>`
      : `<button class="btn" onclick="marcarResolvido('${p.id}','ignorado')">Ignorar</button>

      ? p.compartilhado_com.map(c => '#' + c).join(', ') : '—';

      body = `
        <div class="suggestion">
          <div class="stitle">Correção sugerida</div>

        <div class="compare">
          <div>
            <div class="label">LivePDV · cupom ${p.cupom} (cód duplicado)</div>

  return `

      ${body}
      <div class="item-actions">${actions}</div>
    </div>`;
}

<script>
// ============= VISÃO 2 =============
const V2_ENDPOINT = '/api/painel2';
const V2_VIEW_KEY = 'conf_cartoes_visao';
const V2_DEMO = new URLSearchParams(location.search).has('demo');
let VISAO = (function(){ try { return localStorage.getItem(V2_VIEW_KEY) || 'v1'; } catch(e) { return 'v1'; } })();
const v2 = { dados:null, data:null, loja:null, showOk:false, foco:null, escolha:{}, manual:{}, ligando:null, aplicados:{}, armado:null };

function brl(v) { return (v==null||isNaN(v)) ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function curto(cod) { return cod ? String(cod).slice(0,6) + '…' : ''; }
function formaCurta(f) { return String(f||'').replace(/^\d+\s*-\s*/, ''); }
function tipoZ(t) { return ({credit:'crédito', debit:'débito', pix:'PIX'})[String(t).toLowerCase()] || t || ''; }
function v2Toast(msg) { const t=document.getElementById('v2-toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 4500); }

function v2InitUI() {
  const actions = document.querySelector('header .actions');
  if (actions && !document.getElementById('view-switch')) {
    const sw = document.createElement('div');
    sw.className = 'view-switch'; sw.id = 'view-switch';
    sw.innerHTML = '<button data-v="v1" onclick="setVisao(\'v1\')">☰ Lista</button><button data-v="v2" onclick="setVisao(\'v2\')">⇆ Lado a lado</button>';
    actions.insertBefore(sw, actions.firstChild);
  }
  const main = document.querySelector('main');
  if (main && !document.getElementById('visao2')) {
    const d = document.createElement('div'); d.id = 'visao2'; main.appendChild(d);
    const t = document.createElement('div'); t.id = 'v2-toast'; t.className = 'v2-toast'; document.body.appendChild(t);
  }
  v2MarcarBotoes();
  document.body.classList.toggle('v2', VISAO === 'v2');
}
function v2MarcarBotoes() { document.querySelectorAll('#view-switch button').forEach(b => b.classList.toggle('on', b.dataset.v === VISAO)); }

function setVisao(v) {
  VISAO = v;
  try { localStorage.setItem(V2_VIEW_KEY, v); } catch(e) {}
  document.body.classList.toggle('v2', v === 'v2');
  v2MarcarBotoes();
  const dataSel = (document.getElementById('data-filter')||{}).value || '';
  if (v === 'v2' && (!v2.dados || v2.data !== dataSel)) carregarV2();
  if (v === 'v1' && (!dados || !dados.problemas || !dados.problemas.length) && typeof _conferirV1 === 'function') _conferirV1();
}

// liga a visão 2 no botão "Conferir agora" / troca de data sem mexer na visão 1
const _conferirV1 = conferir;
conferir = function() { return VISAO === 'v2' ? carregarV2() : _conferirV1(); };

function v2KeyAplicados() { return 'conf_v2_aplicados_' + (v2.data || ''); }
function v2LoadAplicados() { try { v2.aplicados = JSON.parse(localStorage.getItem(v2KeyAplicados()) || '{}'); } catch(e) { v2.aplicados = {}; } }
function v2SaveAplicados() { try { localStorage.setItem(v2KeyAplicados(), JSON.stringify(v2.aplicados)); } catch(e) {} }

async function carregarV2() {
  const box = document.getElementById('visao2');
  const btn = document.getElementById('btn-conferir');
  const dataSel = (document.getElementById('data-filter')||{}).value || '';
  v2.data = dataSel; v2.escolha = {}; v2.manual = {}; v2.ligando = null; v2.foco = null;
  v2LoadAplicados();
  box.innerHTML = '<div class="loading active"><span class="spinner"></span> Buscando vendas e cartões do dia...</div>';
  if (btn) btn.disabled = true;
  try {
    let data;
    if (V2_DEMO) { data = JSON.parse(document.getElementById('v2-demo').textContent); }
    else {
      const res = await fetch(V2_ENDPOINT + (dataSel ? '?data=' + dataSel : ''), { method:'POST' });
      data = await res.json().catch(() => null);
      if (!res.ok || !data) throw new Error((data && data.error) || ('HTTP ' + res.status));
    }
    v2.dados = data;
    const lojas = data.lojas || [];
    if (!lojas.find(l => l.loja_id === v2.loja)) {
      const comPend = lojas.find(l => l.resumo.ajustes + l.resumo.investigar > 0);
      v2.loja = (comPend || lojas[0] || {}).loja_id;
    }
    const t = data.totais || {};
    const dr = data.data_referencia ? new Date(data.data_referencia + 'T12:00:00').toLocaleDateString('pt-BR') : '';
    document.getElementById('header-subtitle').textContent = `${dr} · ${t.vendas_livepdv||0} linhas PDV · ${t.transacoes_zoop||0} cartões Zoop${V2_DEMO ? ' · DEMONSTRAÇÃO' : ''}`;
    renderV2();
  } catch (e) {
    box.innerHTML = `<div class="empty-state"><div style="color:var(--danger);font-size:16px;margin-bottom:8px;">Erro ao buscar dados</div><div style="font-size:13px;">${esc(e.message)}</div></div>`;
  } finally { if (btn) btn.disabled = false; }
}

function v2Loja() { return (v2.dados && v2.dados.lojas || []).find(l => l.loja_id === v2.loja); }
function v2Pend(L) {
  let n = 0;
  L.acoes.forEach(a => { if (!v2.aplicados[a.id]) n++; });
  L.zoop.forEach(z => { if (z.status === 'sobrando' && !v2ZUsada(L, z.n)) n++; });
  return n;
}
function v2ZUsada(L, zn) { return L.acoes.some(a => v2.aplicados[a.id] && v2.aplicados[a.id].z === zn); }

function v2Acao(L, pn) {
  const p = L.pdv.find(x => x.n === pn);
  const lista = L.acoes.filter(a => a.p === pn);
  if (v2.manual[pn]) {
    const base = lista.find(a => a.acao === 'preencher' || a.acao === 'trocar');
    if (base) return [Object.assign({}, base, { escolhidoManual: v2.manual[pn] })];
    const zid = v2.manual[pn];
    return [{ id: 'manual_' + p.cupom + '_' + pn, p: pn, cupom: p.cupom, valor: p.valor, manual: true,
      acao: p.cod ? 'trocar' : 'preencher', modo: p.cod ? 'substituir' : 'preencher', cod_atual: p.cod,
      candidatos: [zid], escolhidoManual: zid }];
  }
  return lista;
}
function v2Escolhido(a) {
  if (a.escolhidoManual) return a.escolhidoManual;
  if (v2.escolha[a.id]) return v2.escolha[a.id];
  return a.candidatos && a.candidatos.length === 1 ? a.candidatos[0] : null;
}

function renderV2() {
  const box = document.getElementById('visao2');
  const D = v2.dados; if (!D) return;
  const L = v2Loja();
  const lojaNome = l => (typeof LOJA_NOMES !== 'undefined' && LOJA_NOMES[l.loja_id]) || l.nome || ('Loja ' + l.loja_id);
  let h = '<div class="v2-lojas">' + (D.lojas||[]).map(l => {
    const n = v2Pend(l);
    return `<button class="v2-loja ${l.loja_id===v2.loja?'on':''}" onclick="v2SetLoja(${l.loja_id})">${esc(lojaNome(l))}<span class="n ${n?'':'zero'}">${n||'✓'}</span></button>`;
  }).join('') + '</div>';
  if (!L) { box.innerHTML = h + '<div class="empty-state">Sem vendas de cartão neste dia.</div>'; return; }

  const pend = v2Pend(L);
  h += `<div class="v2-bar"><div><b>${L.resumo.conferidos}</b> conferidos · <b>${pend}</b> pendentes nesta loja</div>
        <label><input type="checkbox" ${v2.showOk?'checked':''} onchange="v2.showOk=this.checked;renderV2()"> mostrar conferidos</label></div>
        <div class="v2-legend"><span><i style="background:var(--warning)"></i>ajuste sugerido</span><span><i style="background:var(--danger)"></i>investigar / gerente</span><span><i style="background:var(--success)"></i>conferido</span><span><i style="background:var(--info)"></i>aplicado</span></div>`;
  h += `<div class="v2-linkbar" id="v2-linkbar" style="display:${v2.ligando?'flex':'none'}"><span>Ligando <b>${esc(v2.ligando||'')}</b>: toque no cartão da maquininha de mesmo valor.</span><button onclick="v2.ligando=null;renderV2()">Cancelar</button></div>`;

  // ---- linhas por valor ----
  const rows = new Map();
  const add = (key, lado, item) => { if (!rows.has(key)) rows.set(key, {v:key, P:[], Z:[]}); rows.get(key)[lado].push(item); };
  const kv = v => Math.round(v * 100);
  const pByN = {}; L.pdv.forEach(p => pByN[p.n] = p);
  L.pdv.forEach(p => {
    const sub = L.acoes.find(a => a.p === p.n && a.subtipo === 'mesmo_cod_no_cupom');
    add(kv(sub && p.status !== 'ok' ? sub.valor : p.valor), 'P', p);
  });
  L.zoop.forEach(z => {
    const par = z.status === 'ok' && z.par && pByN[z.par];
    add(par && par.status === 'ok' ? kv(par.valor) : kv(z.valor), 'Z', z);
  });
  const ordem = [...rows.values()].sort((a,b) => a.v - b.v);
  const relevante = r => v2.showOk || r.P.some(p => p.status !== 'ok') || r.Z.some(z => z.status !== 'ok') || (v2.ligando);

  h += '<div class="v2-head"><div>Vendas no PDV <small>(o que foi lançado)</small></div><div>Maquininha · Zoop <small>(o que passou de verdade)</small></div></div>';
  const vis = ordem.filter(relevante);
  if (!vis.length) h += '<div class="v2-tudo-ok">✓ Tudo conferido nesta loja.</div>';
  vis.forEach(r => {
    const P = v2.showOk ? r.P : r.P.filter(p => p.status !== 'ok' || r.Z.some(z => z.status !== 'ok'));
    const Z = v2.showOk ? r.Z : r.Z.filter(z => z.status !== 'ok' || r.P.some(p => p.status !== 'ok'));
    h += '<div class="v2-row">';
    h += '<div class="v2-cell">' + (P.length ? P.map(p => v2CardP(L, p)).join('') : `<div class="v2-empty">nenhuma venda de ${brl(r.v/100)}</div>`) + '</div>';
    h += '<div class="v2-cell">' + (Z.length ? Z.map(z => v2CardZ(L, z)).join('') : `<div class="v2-empty">nenhum cartão de ${brl(r.v/100)}</div>`) + '</div>';
    h += '</div>';
  });
  box.innerHTML = h;
}

function v2CardP(L, p) {
  const acoes = v2Acao(L, p.n);
  const feito = acoes.length && acoes.every(a => v2.aplicados[a.id]);
  let cls = p.status === 'ok' ? 'ok' : feito ? 'feito' : acoes.some(a => a.acao==='preencher'||a.acao==='trocar') ? 'aj' : 'inv';
  const ligados = new Set(); acoes.forEach(a => (a.candidatos||[]).forEach(c => ligados.add(c))); if (p.par) ligados.add(p.par);
  if (v2.foco && (v2.foco === p.n || (v2.focoLig||[]).includes(p.n))) cls += ' hl';
  if (v2.ligando === p.n) cls += ' sel';
  const tag = {ok:'✓ conferido', aj:'ajustar', inv:'investigar', feito:'✓ aplicado'}[cls.split(' ')[0]];
  let h = `<div class="v2-card ${cls}" id="card-${p.n}">
    <div class="v2-top" onclick="v2Foco('${p.n}', ${JSON.stringify([...ligados])})"><span class="v2-num">${p.n}</span><span class="v2-val">${brl(p.valor)}</span><span class="v2-tag ${cls.split(' ')[0]}">${tag}</span></div>
    <div class="v2-sub">cupom ${esc(p.cupom)} · ${esc(formaCurta(p.forma))}</div>
    <div class="v2-sub">${p.cod ? 'código <code>' + esc(curto(p.cod)) + '</code>' : '<span style="color:var(--warning)">sem código</span>'}${p.par ? ' · par <b>' + p.par + '</b>' : ''}</div>`;
  if (p.status !== 'ok') acoes.forEach(a => { h += v2Bloco(L, p, a); });
  return h + '</div>';
}

function v2Bloco(L, p, a) {
  const zBy = n => L.zoop.find(z => z.n === n);
  const zdesc = n => { const z = zBy(n); return z ? `${z.hora||''} · ${esc(z.bandeira||'')} · ${tipoZ(z.tipo)}` : ''; };
  if (v2.aplicados[a.id]) {
    const ap = v2.aplicados[a.id];
    return `<div class="v2-act"><p class="v2-msg okm">✓ Ligado a <span class="z">${ap.z}</span>. Clique em "Conferir agora" para confirmar.</p></div>`;
  }
  let h = '<div class="v2-act">';
  if (a.acao === 'preencher' || a.acao === 'trocar') {
    const esc1 = v2Escolhido(a);
    const verbo = a.acao === 'preencher' ? 'Venda sem código do cartão.' : (a.subtipo === 'mesmo_cod_no_cupom'
      ? `Cupom com 2 pagamentos usando o mesmo código. O de ${brl(a.valor)} está errado` + (a.parte_ok ? ` (o outro já bate com <span class="z">${a.parte_ok}</span>).` : '.')
      : (a.tipo === 'codigo_duplicado' ? 'Este código está repetido em outro cupom.' : 'Código aponta para o cartão errado.'));
    h += `<p>${verbo}</p>`;
    if (a.candidatos.length > 1 && !a.escolhidoManual) {
      h += `<p style="color:var(--warning)">Há ${a.candidatos.length} cartões de ${brl(a.valor)}. Escolha pela hora/bandeira:</p><div class="v2-chips">` +
        a.candidatos.map(c => `<button class="v2-chip ${esc1===c?'on':''}" onclick="v2Escolher('${a.id}','${c}')">${c} · ${zdesc(c)}</button>`).join('') + '</div>';
    } else if (esc1) {
      h += `<p>Usar <span class="z">${esc1}</span> <span style="color:var(--text-muted)">${zdesc(esc1)}</span>${a.manual||a.escolhidoManual ? ' <i style="color:var(--info)">(escolhido por você)</i>' : ''}</p>`;
    }
    const armado = v2.armado === a.id;
    h += `<div class="v2-btns"><button class="btn v2-btn-ok ${armado?'confirm':''}" ${esc1?'':'disabled'} onclick="v2Aplicar(${L.loja_id},'${p.n}','${a.id}')">${armado ? 'Confirmar ' + p.n + ' → ' + esc1 : (esc1 ? 'Ajustar ' + p.n + ' → ' + esc1 : 'Escolha o cartão')}</button>
          <button class="btn" onclick="v2Ligar('${p.n}')">Outro cartão</button></div><div class="v2-msg" id="msg-${a.id}"></div>`;
  } else {
    const sobras = L.zoop.filter(z => z.status === 'sobrando' && !v2ZUsada(L, z.n));
    const txt = {
      sem_cartao: `Não há cartão de ${brl(p.valor)} na maquininha. Foi dinheiro ou PIX lançado como cartão? Valor digitado errado?`,
      duplicado: `Parece lançado 2 vezes: há mais vendas de ${brl(p.valor)} sem código do que cartões desse valor. <b>Chamar o gerente</b> para apagar o pagamento repetido.`,
      divergencia: `O código aponta para ${a.z_do_codigo ? '<span class="z">'+a.z_do_codigo+'</span>' : 'um cartão'} de ${brl(a.valor_zoop)}, mas a venda é ${brl(a.valor)}. O valor no PDV precisa ser corrigido.`,
      codigo_duplicado_sem_cartao: `Código repetido em outro cupom e não há cartão livre de ${brl(p.valor)}. Chamar o gerente.`,
    }[a.motivo] || 'Investigar.';
    h += `<p>${txt}</p>`;
    if (sobras.length && a.motivo !== 'duplicado') h += `<p style="color:var(--text-muted);font-size:12px">Cartões sobrando nesta loja: ${sobras.map(z => '<span class="z">'+z.n+'</span> '+brl(z.valor)).join(' · ')}</p>`;
    if (a.motivo !== 'duplicado') h += `<div class="v2-btns"><button class="btn" onclick="v2Ligar('${p.n}')">Ligar a um cartão</button></div>`;
  }
  return h + '</div>';
}

function v2CardZ(L, z) {
  const usada = v2ZUsada(L, z.n);
  let st = usada ? 'feito' : z.status === 'ok' ? 'ok' : z.status === 'sugerido' ? 'aj' : 'inv';
  const lig = z.par ? [z.par] : (z.sugerido_para || []);
  let cls = st;
  if (v2.foco && (v2.foco === z.n || (v2.focoLig||[]).includes(z.n))) cls += ' hl';
  let onclick = `v2Foco('${z.n}', ${JSON.stringify(lig)})`;
  if (v2.ligando && z.status !== 'ok' && !usada) { cls += ' alvo'; onclick = `v2Ligado('${z.n}')`; }
  const tag = usada ? '✓ usado' : z.status === 'ok' ? '✓ ' + (z.par||'') : z.status === 'sugerido' ? '→ ' + lig.join(', ') : 'sem venda';
  let h = `<div class="v2-card ${cls}" onclick="${onclick}">
    <div class="v2-top"><span class="v2-num">${z.n}</span><span class="v2-val">${brl(z.valor)}</span><span class="v2-tag ${st}">${tag}</span></div>
    <div class="v2-sub">${esc(z.hora)} · ${esc(z.bandeira)} · ${esc(tipoZ(z.tipo))}</div>
    <div class="v2-sub">aut <code>${esc(z.aut||'—')}</code> · <code>${esc(curto(z.zoop_id))}</code></div>`;
  if (z.status === 'sobrando' && !usada && !v2.ligando) h += `<div class="v2-act"><p>Passou na maquininha e não tem venda no PDV com este valor. Venda não lançada, ou lançada com valor/forma errados.</p></div>`;
  return h + '</div>';
}

function v2SetLoja(id) { v2.loja = id; v2.ligando = null; v2.foco = null; renderV2(); window.scrollTo({top:0}); }
function v2Foco(n, lig) { if (v2.foco === n) { v2.foco = null; v2.focoLig = []; } else { v2.foco = n; v2.focoLig = lig || []; } renderV2(); }
function v2Escolher(aid, zn) { v2.escolha[aid] = zn; v2.armado = null; renderV2(); }
function v2Ligar(pn) { v2.ligando = pn; v2.foco = null; renderV2(); v2Toast('Agora toque no cartão da maquininha (coluna da direita).'); }
function v2Ligado(zn) {
  const L = v2Loja(); const p = L.pdv.find(x => x.n === v2.ligando); const z = L.zoop.find(x => x.n === zn);
  const pv = p.valor;
  const base = L.acoes.find(a => a.p === p.n && a.subtipo === 'mesmo_cod_no_cupom');
  const valorAlvo = base ? base.valor : pv;
  if (Math.abs(z.valor - valorAlvo) >= 2) { v2Toast(`Valores não casam: ${p.n} ${brl(valorAlvo)} × ${zn} ${brl(z.valor)}. Corrija o valor no PDV ou chame o gerente.`); return; }
  v2.manual[p.n] = zn; v2.ligando = null; v2.armado = null; renderV2();
  const el = document.getElementById('card-' + p.n); if (el) el.scrollIntoView({block:'center', behavior:'smooth'});
}

async function v2Aplicar(lojaId, pn, aid) {
  const L = (v2.dados.lojas||[]).find(l => l.loja_id === lojaId);
  const a = v2Acao(L, pn).find(x => x.id === aid); if (!a) return;
  const zn = v2Escolhido(a); if (!zn) return;
  if (v2.armado !== aid) { v2.armado = aid; renderV2(); setTimeout(() => { if (v2.armado === aid) { v2.armado = null; renderV2(); } }, 5000); return; }
  v2.armado = null;
  const z = L.zoop.find(x => x.n === zn);
  const payload = { cupom_id: String(a.cupom).replace(/^0+/, ''), cod_autoriza: z.zoop_id, valor_esperado: a.valor, modo: a.modo };
  if (a.modo === 'substituir') payload.cod_atual = a.cod_atual;
  const msg = document.getElementById('msg-' + aid);
  if (msg) { msg.className = 'v2-msg'; msg.textContent = 'Gravando no LivePDV...'; }
  try {
    if (!V2_DEMO) {
      const res = await fetch('/api/aprovar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const r = await res.json().catch(() => ({}));
      if (!res.ok || !r.ok) throw new Error(r.error || ('HTTP ' + res.status));
    }
    v2.aplicados[aid] = { z: zn, em: new Date().toISOString(), cupom: a.cupom };
    v2SaveAplicados(); renderV2(); v2Toast(`${pn} ligado a ${zn}${V2_DEMO ? ' (demonstração, nada foi gravado)' : ''}.`);
  } catch (e) {
    if (msg) { msg.className = 'v2-msg err'; msg.textContent = 'Não gravou: ' + e.message; }
  }
}

v2InitUI();
</script>

</body>
</html>
